server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # /api/* 를 backend 컨테이너로 리버스 프록시 (prefix는 벗겨서 전달)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /chat이 NDJSON을 줄 단위로 스트리밍하는데, 기본값(on)이면 nginx가
        # 응답을 다 모았다가 한 번에 내려보내서 실시간성이 사라진다.
        proxy_buffering off;
    }
}
